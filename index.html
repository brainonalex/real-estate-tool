<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>不動産価値判断ツール / 일본 부동산 가치 판단 툴 (V32)</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background-color: #f0f2f5; color: #1c1e21; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 35px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .header { border-bottom: 3px solid #1a73e8; padding-bottom: 15px; margin-bottom: 25px; color: #1a73e8; font-size: 24px; font-weight: bold; }
        .form-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .full-width { grid-column: span 2; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #4b4b4b; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; background-color: #f9f9f9; }
        .btn-api { background-color: #34a853; color: white; border: none; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; box-shadow: 0 4px 6px rgba(52,168,83,0.3); transition: 0.3s; }
        #api_log { font-size: 13px; color: #1a73e8; margin-top: 15px; background: #e8f0fe; padding: 15px; border-radius: 8px; display: none; line-height: 1.6; }
        #env_dashboard { display: none; background:#fff; border: 2px solid #ddd; border-radius: 8px; padding: 20px; margin-top: 20px; }
        .dashboard-title { margin-top:0; color:#1c1e21; border-bottom:2px solid #eee; padding-bottom:10px; font-size: 18px; }
        .chart-container { position: relative; height: 350px; width: 100%; margin-top: 20px; display: none; background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 15px; box-sizing: border-box; }
        .result-box { margin-top: 25px; padding: 30px; border-radius: 12px; border: 2px solid #eee; background-color: #f8f9fa; text-align: center; }
        .score-circle { font-size: 65px; font-weight: bold; margin: 15px 0; color: #1a73e8; }
        .details-list { list-style: none; padding: 0; text-align: left; }
        .details-list li { margin-bottom: 10px; font-size: 15px; padding: 12px; border-radius: 6px; border-left: 6px solid #1a73e8; background: #fff; }
        .alert { border-left-color: #d93025 !important; color: #a50e0e; background-color: #fce8e6 !important; }
        .good { border-left-color: #1e8e3e !important; color: #0d652d; background-color: #e6f4ea !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
</head>
<body>
<div class="container">
    <div class="header">🏢 不動産投資 価値判断ツール / 부동산 투자 가치 판단 툴</div>

    <div class="form-section">
        <div class="form-group full-width">
            <label>物件住所 / 물건 주소 (例: 千葉県松戸市... / 東京都新宿区...)</label>
            <input type="text" id="full_address" placeholder="住所を入力してください" value="千葉県松戸市">
            <button type="button" class="btn-api" onclick="startAnalysis()">🚀 分析開始 / 통합 분석 시작</button>
            <div id="api_log"></div>
        </div>

        <div id="env_dashboard" class="full-width">
            <h3 class="dashboard-title">📊 環境・災害リスク・実取引 / 주변 환경 및 재해 분석</h3>
            <div id="pop_content" style="font-size:16px; margin-bottom:10px;"></div>
            <div id="hazard_content" style="font-size:16px; margin-bottom:10px;"></div>
            <div id="real_trade_info" style="font-size:14px; color:#555; background:#f8f9fa; padding:12px; border-radius:8px; border-left: 4px solid #34a853;"></div>
        </div>

        <div class="chart-container full-width" id="chart_wrapper"><canvas id="priceChart"></canvas></div>

        <div class="form-group"><label>エリア区分 / 지역 구분</label><select id="area" onchange="calculateValue();"><option value="tokyo_osaka">コアエリア / 코어 지역</option><option value="local">地方都市 / 지방 도시</option></select></div>
        <div class="form-group"><label>駐車場 / 주차장</label><select id="parking" onchange="calculateValue()"><option value="yes">完備 / 완비</option><option value="no">無し / 없음</option></select></div>
        <div class="form-group"><label>物件価格 / 매매 가격 (円)</label><input type="text" id="price" value="50,000,000" oninput="formatAndCalc(this)"></div>
        <div class="form-group"><label>土地面積 / 토지 면적 (㎡)</label><input type="number" id="land_area" value="80" oninput="calculateValue();"></div>
        <div class="form-group"><label>積算価格 / 적산 가격 (円)</label><input type="text" id="sekisan" value="35,000,000" oninput="formatAndCalc(this)"></div>
        <div class="form-group"><label>築年数 / 건축 연수</label><select id="age" onchange="calculateValue()"></select></div>
        <div class="form-group"><label>駅徒歩 / 역 도보 거리 (分)</label><select id="station_dist" onchange="calculateValue()"></select></div>
        <div class="form-group"><label>月間純CF / 월 순 현금흐름 (円)</label><input type="text" id="cashflow" value="100,000" oninput="formatAndCalc(this)"></div>
        <div class="form-group full-width"><label style="color:#d93025;"><input type="checkbox" id="illegal" onchange="calculateValue()"> 違법건축・再건축불가 / 위법건축·재건축 불가</label></div>
    </div>

    <div id="result_section" class="result-box">
        <div style="font-size: 22px; font-weight: bold;" id="final_status">判定待ち / 분석 대기 중...</div>
        <div class="score-circle" id="final_score">-- 点</div>
        <ul class="details-list" id="feedback_list"></ul>
    </div>
</div>

<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyASsw6ve3g5GFOKp-gQYZ7Rd_7FSBe0vEk&libraries=places"></script>
<script>
    let combinedChart = null;
    window.hazardPenalties = []; window.popBonus = { active: false, growth: 0 };
    const WORKER_URL = "https://falling-pond-d864.alexall1972.workers.dev/?url=";

    document.addEventListener('DOMContentLoaded', function() {
        const ageS = document.getElementById('age'); for(let i=0; i<=50; i++) { let o=document.createElement('option'); o.value=i; o.innerHTML=i+"年"; if(i===10) o.selected=true; ageS.appendChild(o); }
        const distS = document.getElementById('station_dist'); for(let i=1; i<=50; i++) { let o=document.createElement('option'); o.value=i; o.innerHTML=i+"分"; if(i===8) o.selected=true; distS.appendChild(o); }
    });

    async function startAnalysis() {
        const address = document.getElementById('full_address').value;
        const log = document.getElementById('api_log'); if (!address) return;
        log.style.display = "block"; log.innerHTML = "🔄 <b>分析エンジン起動中... / 분석 엔진 가동 중...</b><br>";
        document.getElementById('env_dashboard').style.display = 'block';
        
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode({ 'address': address }, async function(results, status) {
            if (status === 'OK') {
                const loc = results[0].geometry.location;
                log.innerHTML += `✅ 座標取得成功 / 좌표 특정 완료<br>`;
                calculateStationDistance(loc, log);
                // ★ V32 핵심: 주소 데이터(results[0])를 그대로 전달하여 전국 대응
                await Promise.all([fetchXITRealTradeData(results[0], log), checkEnvironment(loc.lat(), loc.lng(), log)]);
                document.getElementById('final_status').innerText = "解析完了 / 분석 완료";
                calculateValue();
            }
        });
    }

    async function fetchXITRealTradeData(geoResult, log) {
        let cityCode = ""; 
        let prefCode = "";
        const addrComps = geoResult.address_components;
        
        // 구글 주소 컴포넌트에서 시구정촌 및 도도부현 추출
        let prefName = "", cityName = "";
        addrComps.forEach(c => {
            if(c.types.includes("administrative_area_level_1")) prefName = c.long_name;
            if(c.types.includes("locality") || c.types.includes("sublocality_level_1")) cityName = c.long_name;
        });

        // 행정구역 매핑 (일본 전국 대응용 간이 사전 - 실제 운영시엔 DB연동 권장)
        const cityCodes = {
            "松戸市":"12207", "新宿区":"13104", "中央区":"13102", "港区":"13103", "渋谷区":"13113", "品川区":"13109", "大阪市北区":"27127"
        };
        const prefCodes = { "東京都":"13", "千葉県":"12", "神奈川県":"14", "大阪府":"27", "埼玉県":"11" };

        cityCode = cityCodes[cityName] || "";
        prefCode = prefCodes[prefName] || "13";

        log.innerHTML += `🔍 判定地域: ${prefName} ${cityName} (${cityCode || '広域検索'})<br>`;

        const currentYear = new Date().getFullYear();
        let query = cityCode ? `city=${cityCode}` : `area=${prefCode}`;
        const targetUrl = `https://www.reinfolib.mlit.go.jp/ex-api/external/XIT001?year=${currentYear-1}&quarter=1&${query}&priceClassification=01`;
        
        try {
            const res = await fetch(WORKER_URL + encodeURIComponent(targetUrl)).then(r => r.json());
            if (res.status === "OK" && res.data.length > 0) {
                // 해당 도시의 여러 거래 데이터 중 평균값 계산 (V32 개선)
                let sum = 0, count = 0;
                res.data.slice(0, 5).forEach(d => {
                    let p = parseInt(d.UnitPrice || d.TradePrice / d.Area, 10);
                    if(p) { sum += p; count++; }
                });
                let avgPrice = Math.round(sum / count);
                
                document.getElementById('real_trade_info').innerHTML = 
                    `📍 <b>実取引事例 / 실거래 정보:</b> ${prefName} ${cityName} 근처 거래 사례 분석 완료<br>` +
                    `💰 <b>推定単価 / 추정 단가:</b> ¥${avgPrice.toLocaleString()} / ㎡`;

                // 추세 곡선 (지역에 따른 가중치 차등)
                const isTokyo = prefName === '東京都';
                const trend = isTokyo ? [0.82, 0.85, 0.88, 0.91, 0.93, 0.94, 0.95, 0.97, 1.00, 1.03] : [0.90, 0.91, 0.92, 0.92, 0.93, 0.93, 0.94, 0.96, 1.00, 1.01];
                let ps = []; let ls = [];
                for (let i = 0; i < 10; i++) { ls.push(`${2016+i}年`); ps.push(Math.round(avgPrice * (trend[i]/trend[8]))); }
                drawTrendChart(ps, ls);
            }
        } catch(e) { log.innerHTML += `<br>❌ API 호출 실패 (데이터 부재)`; }
    }

    async function checkEnvironment(lat, lng, log) {
        const pt = turf.point([lng, lat]);
        const tile = getTileCoordinate(lat, lng, 15);
        try {
            const res = await fetch(WORKER_URL + encodeURIComponent(`https://www.reinfolib.mlit.go.jp/ex-api/external/XKT031?response_format=geojson&z=15&x=${tile.x}&y=${tile.y}`)).then(r => r.json());
            if (res.features) {
                for (let f of res.features) {
                    if (turf.booleanPointInPolygon(pt, f)) {
                        let g = (((f.properties.A16_005 - f.properties.A16_007) / f.properties.A16_007) * 100).toFixed(1);
                        window.popBonus = { active: true, growth: parseFloat(g) };
                        document.getElementById('pop_content').innerHTML = `🏙️ <b>人口集中地区(DID):</b> 該当(해당) / 📈 <b>増加率(증가율):</b> ${g}%`; break;
                    }
                }
            }
        } catch(e) {}
        const hazards = [{id:'XKT026', name:'洪水/홍수'}, {id:'XKT028', name:'津波/쓰나미'}, {id:'XKT025', name:'液状化/액상화'}];
        let hHtml = ""; window.hazardPenalties = [];
        for (let h of hazards) {
            try {
                const res = await fetch(WORKER_URL + encodeURIComponent(`https://www.reinfolib.mlit.go.jp/ex-api/external/${h.id}?response_format=geojson&z=15&x=${tile.x}&y=${tile.y}`)).then(r => r.json());
                let isD = false;
                if (res.features) {
                    for (let f of res.features) {
                        if (turf.booleanPointInPolygon(pt, f)) {
                            if (h.id === 'XKT025' && !f.properties.note.includes('しやすい')) continue;
                            isD = true; window.hazardPenalties.push({name: h.name, penalty: 20}); break;
                        }
                    }
                }
                hHtml += isD ? `<span style="color:#d93025; font-weight:bold;">❌ ${h.name}: 該当</span> ` : `<span style="color:#1e8e3e">✅ ${h.name}: 安全</span> `;
            } catch(e) {}
        }
        document.getElementById('hazard_content').innerHTML = hHtml;
    }

    function calculateStationDistance(l, log) {
        const s = new google.maps.places.PlacesService(document.createElement('div'));
        s.nearbySearch({ location: l, radius: 1500, type: ['train_station'] }, function(p, st) {
            if (st === google.maps.places.PlacesServiceStatus.OK && p.length > 0) {
                const ds = new google.maps.DistanceMatrixService();
                ds.getDistanceMatrix({ origins: [l], destinations: [p[0].geometry.location], travelMode: 'WALKING' }, function(dr, ds) {
                    if (ds === 'OK') {
                        let m = Math.ceil(dr.rows[0].elements[0].duration.value / 60);
                        document.getElementById('station_dist').value = m > 50 ? 50 : m;
                        log.innerHTML += `✅ <b>最寄駅/가까운 역:</b> [${p[0].name}] ${m}分(분)<br>`; calculateValue();
                    }
                });
            }
        });
    }

    function drawTrendChart(p, l) {
        document.getElementById('chart_wrapper').style.display = 'block'; const ctx = document.getElementById('priceChart').getContext('2d');
        if(combinedChart) combinedChart.destroy();
        combinedChart = new Chart(ctx, { type: 'line', data: { labels: l, datasets: [{ label: '推定市場価格 / 시장 추정가 (円/㎡)', data: p, borderColor: '#1a73e8', backgroundColor: 'rgba(26,115,232,0.1)', fill: true, tension: 0.1, borderWidth: 3 }] } });
    }

    function getTileCoordinate(lat, lon, zoom) {
        const x = Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
        const latRad = lat * Math.PI / 180;
        const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * Math.pow(2, zoom));
        return { z: zoom, x: x, y: y };
    }

    function formatAndCalc(i) { let v = i.value.replace(/,/g, ''); if (!isNaN(v) && v !== "") i.value = Number(v).toLocaleString(); calculateValue(); }

    function calculateValue() {
        const getN = (id) => parseFloat(document.getElementById(id).value.replace(/,/g, '')) || 0;
        const price = getN('price'); const sekisan = getN('sekisan');
        const stationDist = parseInt(document.getElementById('station_dist').value);
        let score = 100; let feedbacks = [];
        if (getN('cashflow') < 0) { score -= 30; feedbacks.push({msg: "⚠️ CFマイナス / 현금흐름 마이너스", type:'alert'}); }
        if (document.getElementById('illegal').checked) { score = 0; feedbacks.push({msg: "❌ 投資不適合 / 투자 부적격(위법건축)", type:'alert'}); }
        const sekisanRatio = (sekisan / price) * 100;
        if (sekisanRatio < 60) { score -= 20; feedbacks.push({msg: "⚠️ 積算価値不足 / 적산 가치 낮음", type:'alert'}); }
        if (stationDist <= 5) score += 10; else if (stationDist > 12) score -= 15;
        if (window.popBonus.active && window.popBonus.growth > 0) score += 5;
        window.hazardPenalties.forEach(h => { score -= 20; feedbacks.push({msg: `🚨 災害リスク: ${h.name} / 재해 리스크 해당`, type:'alert'}); });
        score = Math.max(0, Math.min(100, score));
        document.getElementById('final_score').innerText = score + " 점";
        const st = document.getElementById('final_status');
        if (score >= 80) { st.innerText = "✅ 積極検討 / 적극 검토"; st.style.color = "#1e8e3e"; }
        else if (score >= 60) { st.innerText = "⚠️ 慎重調査 / 주의 및 조사 필요"; st.style.color = "#f9ab00"; }
        else { st.innerText = "❌ 見送り推奨 / 투자 보류 추천"; st.style.color = "#d93025"; }
        document.getElementById('feedback_list').innerHTML = feedbacks.map(f => `<li class="${f.type}">${f.msg}</li>`).join('');
    }
</script>
</body>
</html>
