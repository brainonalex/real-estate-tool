<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>不動産投資 価値判断ツール (V7 地価推移)</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: #f0f2f5; color: #1c1e21; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { font-size: 24px; color: #1a73e8; border-bottom: 3px solid #1a73e8; padding-bottom: 15px; margin-bottom: 30px; }
        .form-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .full-width { grid-column: span 2; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #4b4b4b; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; background-color: #f9f9f9; }
        input:focus { outline: none; border-color: #1a73e8; background-color: #fff; }
        .unit-group { display: flex; gap: 10px; align-items: center; }
        .unit-group select { width: 80px; }
        .price-info { font-size: 13px; color: #1a73e8; margin-top: 5px; font-weight: bold; }
        button { background-color: #1a73e8; color: white; border: none; padding: 18px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; }
        button:hover { background-color: #1557b0; }
        .btn-api { background-color: #34a853; padding: 12px; font-size: 16px; margin-top: 10px; }
        .btn-api:hover { background-color: #2b8c45; }
        .result-box { margin-top: 40px; padding: 30px; border-radius: 12px; display: none; border: 2px solid #eee; }
        .score-circle { font-size: 60px; font-weight: bold; text-align: center; margin: 20px 0; }
        .status { font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .details-list { list-style: none; padding: 0; }
        .details-list li { margin-bottom: 12px; font-size: 16px; padding: 12px; border-radius: 6px; border-left: 6px solid #1a73e8; }
        .alert { border-left-color: #d93025 !important; color: #a50e0e; background-color: #fce8e6 !important; }
        .warning { border-left-color: #f9ab00 !important; color: #a67300; background-color: #fef7e0 !important; }
        .good { border-left-color: #1e8e3e !important; color: #0d652d; background-color: #e6f4ea !important; }
        #api_log { font-size: 13px; color: #1a73e8; margin-top: 10px; font-weight: bold; line-height: 1.5; }
        
        /* 그래프 영역 스타일 */
        .chart-container { position: relative; height: 250px; width: 100%; margin-top: 15px; display: none; background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 20px; }
            .form-section { grid-template-columns: 1fr; gap: 15px; }
            .full-width { grid-column: span 1; }
            .unit-group { flex-direction: row; }
        }
    </style>
    <!-- 그래프를 그리기 위한 Chart.js 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h1>不動産投資 価値判断ツール (V7)</h1>
    
    <div class="form-section">
        <div class="form-group">
            <label>エリア (지역)</label>
            <select id="area" onchange="toggleParking()">
                <option value="tokyo_osaka">東京/大阪コアエリア</option>
                <option value="local">地方主要都市</option>
            </select>
        </div>

        <div class="form-group" id="parking_group" style="display:none;">
            <label>駐車場 (주차장)</label>
            <select id="parking">
                <option value="yes">完備</option>
                <option value="no">無し</option>
            </select>
        </div>

        <div class="form-group full-width">
            <label>物件住所 (물건 주소 입력)</label>
            <input type="text" id="address" placeholder="例: 東京都新宿区歌舞伎町1-1-1">
            <button type="button" class="btn-api" onclick="fetchLocationAndLandPrice()">📍 地価推移と駅徒歩を自動取得 (공시지가 및 역 도보 가져오기)</button>
            <div id="api_log"></div>
            
            <!-- 공시지가 5년 추이 그래프가 나타날 영역 -->
            <div class="chart-container" id="chart_wrapper">
                <canvas id="landPriceChart"></canvas>
            </div>
        </div>

        <div class="form-group">
            <label>物件価格 (매매가 - 円)</label>
            <input type="text" id="price" value="120,000,000" oninput="formatAndCalc(this)">
        </div>

        <div class="form-group">
            <label>土地面積 (토지 면적)</label>
            <div class="unit-group">
                <input type="number" id="land_area" value="100" step="0.01" oninput="calculateUnitPrices()">
                <select id="land_unit" onchange="calculateUnitPrices()">
                    <option value="m2">㎡</option>
                    <option value="tsubo">坪</option>
                </select>
            </div>
            <div id="land_price_info" class="price-info">単価: -</div>
        </div>

        <div class="form-group">
            <label>積算価格 (적산가 - 円)</label>
            <input type="text" id="sekisan" value="85,000,000" oninput="formatAndCalc(this)">
        </div>

        <div class="form-group">
            <label>延床面積 (건물 연면적)</label>
            <div class="unit-group">
                <input type="number" id="build_area" value="200" step="0.01">
                <select id="build_unit">
                    <option value="m2">㎡</option>
                    <option value="tsubo">坪</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>築年数 (건축 경과 연수 - 年)</label>
            <select id="age"></select> 
        </div>

        <div class="form-group">
            <label>駅徒歩 (역 도보 - 分)</label>
            <select id="station_dist"></select>
        </div>

        <div class="form-group">
            <label>総戸数 (총 방 개수 - 戸)</label>
            <input type="number" id="room_count" value="10">
        </div>

        <div class="form-group">
            <label>現状の月額総家賃 (현재 총 월세 - 円)</label>
            <input type="text" id="current_rent" value="750,000" oninput="formatAndCalc(this)">
        </div>

        <div class="form-group">
            <label>周辺相場家賃/戸 (방 1개당 주변 평균 월세 - 円)</label>
            <input type="text" id="market_rent_per_room" value="80,000" oninput="formatAndCalc(this)">
        </div>

        <div class="form-group">
            <label>月間純キャッシュフロー (월 순 현금흐름 - 円)</label>
            <input type="text" id="cashflow" value="150,000" oninput="formatAndCalc(this)">
        </div>
    </div>

    <div class="form-group full-width">
        <label style="color:#d93025;"><input type="checkbox" id="illegal" style="transform: scale(1.3); margin-right: 10px;"> 再建築不可 / 違法建築 (재건축 불가 / 위법 건축)</label>
    </div>

    <button onclick="calculateValue()">投資価値を判定する (판정하기)</button>

    <div id="result_section" class="result-box">
        <div class="status" id="final_status">判定結果</div>
        <div class="score-circle" id="final_score">0点</div>
        <ul class="details-list" id="feedback_list"></ul>
    </div>
</div>

<!-- ★ V6에서 발급받은 구글 API 키를 여기에 다시 넣어주세요 ★ -->
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyASsw6ve3g5GFOKp-gQYZ7Rd_7FSBe0vEk&libraries=places"></script>

<script>
    let priceChart = null; // 차트 객체 초기화

    document.addEventListener('DOMContentLoaded', function() {
        const ageSelect = document.getElementById('age');
        for(let i=0; i<=50; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerHTML = i + " 年";
            if(i === 10) opt.selected = true;
            ageSelect.appendChild(opt);
        }
        const distSelect = document.getElementById('station_dist');
        for(let i=1; i<=30; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerHTML = i + " 分";
            if(i === 8) opt.selected = true;
            distSelect.appendChild(opt);
        }
        calculateUnitPrices();
    });

    // 지가 및 역 거리 가져오기 메인 함수
    function fetchLocationAndLandPrice() {
        const address = document.getElementById('address').value;
        const log = document.getElementById('api_log');
        if (!address) { alert('住所を入力してください。(주소를 먼저 입력해 주세요.)'); return; }

        log.innerHTML = "🔄 座標を抽出中... (좌표 추출 및 데이터 가져오는 중...)<br>";
        
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode({ 'address': address }, function(results, status) {
            if (status === 'OK') {
                const location = results[0].geometry.location;
                const lat = location.lat();
                const lng = location.lng();
                
                // 1. 역 도보 거리 계산 로직 (기존 유지)
                calculateStationDistance(location, log);

                // 2. 공시지가 변동 추이 가져오기 (UI 시뮬레이션)
                // 실제 국토교통성 API 연동 전, 시각화와 로직을 검증하기 위한 데이터 형태입니다.
                log.innerHTML += `✅ 座標取得成功 (Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)})<br>🔄 国土交通省の地価データを読み込み中...`;
                
                setTimeout(() => {
                    // 도심/지방에 따른 가상의 공시지가 트렌드 시뮬레이션
                    const areaType = document.getElementById('area').value;
                    let mockPrices = areaType === 'tokyo_osaka' ? 
                        [1250000, 1280000, 1310000, 1360000, 1420000] : // 도심 상승장
                        [150000, 148000, 145000, 144000, 142000];       // 지방 하락/보합장

                    drawTrendChart(mockPrices);
                    log.innerHTML += `<br>✅ 過去5年間の地価推移をグラフに反映しました。(5년 지가 추이 반영 완료!)`;
                }, 1000);

            } else {
                log.innerHTML = "❌ 住所を認識できませんでした。(주소를 인식할 수 없습니다.)";
                log.style.color = "#d93025";
            }
        });
    }

    // 구글 맵: 주변 역 탐색 및 도보 시간 계산
    function calculateStationDistance(location, log) {
        const service = new google.maps.places.PlacesService(document.createElement('div'));
        service.nearbySearch({ location: location, radius: 1500, type: ['train_station', 'subway_station'] }, function(places, placesStatus) {
            if (placesStatus === google.maps.places.PlacesServiceStatus.OK && places.length > 0) {
                const nearestStation = places[0];
                const distanceService = new google.maps.DistanceMatrixService();
                distanceService.getDistanceMatrix({
                    origins: [location], destinations: [nearestStation.geometry.location], travelMode: 'WALKING',
                }, function(distResponse, distStatus) {
                    if (distStatus === 'OK' && distResponse.rows[0].elements[0].status === 'OK') {
                        let walkMinutes = Math.ceil(distResponse.rows[0].elements[0].duration.value / 60);
                        document.getElementById('station_dist').value = walkMinutes > 30 ? 30 : walkMinutes;
                        log.innerHTML += `<br>✅ 最寄駅 [${nearestStation.name}] 徒歩 ${walkMinutes} 分`;
                    }
                });
            }
        });
    }

    // 공시지가 그래프 그리기 (Chart.js)
    function drawTrendChart(prices) {
        document.getElementById('chart_wrapper').style.display = 'block';
        const ctx = document.getElementById('landPriceChart').getContext('2d');
        
        // 기존 차트가 있으면 지우고 다시 그림
        if(priceChart) { priceChart.destroy(); }

        const currentYear = new Date().getFullYear();
        const labels = [currentYear-4 + '年', currentYear-3 + '年', currentYear-2 + '年', currentYear-1 + '年', currentYear + '年'];

        // 상승장인지 하락장인지에 따라 선 색상 변경
        const isUpward = prices[4] >= prices[0];
        const lineColor = isUpward ? '#d93025' : '#1a73e8'; // 오르면 빨간색, 내리면 파란색
        const bgColor = isUpward ? 'rgba(217, 48, 37, 0.1)' : 'rgba(26, 115, 232, 0.1)';

        priceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '公示地価 (円/㎡)',
                    data: prices,
                    borderColor: lineColor,
                    backgroundColor: bgColor,
                    borderWidth: 2,
                    pointBackgroundColor: lineColor,
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: false, ticks: { callback: function(value) { return value.toLocaleString() + '円'; } } }
                }
            }
        });

        // 최신 지가를 바탕으로 토지 면적 단가 정보 업데이트 (가이드용)
        document.getElementById('land_price_info').innerHTML = `💡 参考: 最新の公示地価は <b>¥${prices[4].toLocaleString()}/㎡</b> です。`;
        document.getElementById('land_price_info').style.color = "#d93025";
    }

    // 콤마 포맷팅 및 가치 평가 로직 (이전 버전과 동일하게 유지)
    function formatAndCalc(input) {
        let value = input.value.replace(/,/g, '');
        if (!isNaN(value) && value !== "") input.value = Number(value).toLocaleString();
        calculateUnitPrices();
    }

    function calculateUnitPrices() {
        const price = parseFloat(document.getElementById('price').value.replace(/,/g, '')) || 0;
        let area = parseFloat(document.getElementById('land_area').value) || 0;
        const unit = document.getElementById('land_unit').value;
        if (area > 0 && price > 0) {
            let areaM2 = (unit === 'tsubo') ? area * 3.30578 : area;
            let areaTsubo = (unit === 'm2') ? area / 3.30578 : area;
            document.getElementById('land_price_info').innerHTML = 
                `㎡単価: ¥${Math.round(price / areaM2).toLocaleString()} / 坪単価: ¥${Math.round(price / areaTsubo).toLocaleString()}`;
            document.getElementById('land_price_info').style.color = "#1a73e8";
        }
    }

    function toggleParking() { document.getElementById('parking_group').style.display = (document.getElementById('area').value === 'local') ? 'block' : 'none'; }

    function calculateValue() {
        const getNum = (id) => parseFloat(document.getElementById(id).value.replace(/,/g, '')) || 0;
        const price = getNum('price'); const sekisan = getNum('sekisan');
        const age = parseInt(document.getElementById('age').value);
        const stationDist = parseInt(document.getElementById('station_dist').value);
        const roomCount = parseInt(document.getElementById('room_count').value) || 0;
        const currentRent = getNum('current_rent'); const marketRentPerRoom = getNum('market_rent_per_room');
        const cashflow = getNum('cashflow'); const illegal = document.getElementById('illegal').checked;

        const totalMarketRent = roomCount * marketRentPerRoom;
        let score = 100; let isRejected = false; let feedbacks = [];

        if (illegal || cashflow < 0 || stationDist > 12) isRejected = true;
        
        const sekisanRatio = (sekisan / price) * 100;
        if (sekisanRatio < 60) { score -= 30; feedbacks.push({ msg: `【注意】 積算比率(${sekisanRatio.toFixed(1)}%)が低いです。`, type: "alert" }); }
        else if (sekisanRatio >= 80) feedbacks.push({ msg: "【良好】 積算比率が高い資産価値のある物件です。", type: "good" });

        if (stationDist <= 5) feedbacks.push({ msg: "【最強】 圧倒的な駅近立地です。", type: "good" });

        const rentGap = ((totalMarketRent - currentRent) / currentRent) * 100;
        if (rentGap > 5) { feedbacks.push({ msg: `【魅力】 賃料アップ余地(${rentGap.toFixed(1)}%)があります。`, type: "good" }); score += 10; }

        const resultSection = document.getElementById('result_section'); resultSection.style.display = 'block';
        const statusEl = document.getElementById('final_status');
        
        score = Math.max(0, Math.min(100, score));
        if (isRejected) score = 0;
        document.getElementById('final_score').innerText = score + " 点";

        if (isRejected) { statusEl.innerText = "🚨 投資対象外 (Reject)"; statusEl.style.color = "#d93025"; }
        else if (score >= 80) { statusEl.innerText = "✅ 積極検討 (Pass)"; statusEl.style.color = "#1e8e3e"; }
        else { statusEl.innerText = "⚠️ 慎重調査 (Hold)"; statusEl.style.color = "#f9ab00"; }

        document.getElementById('feedback_list').innerHTML = feedbacks.map(f => `<li class="${f.type}">${f.msg}</li>`).join('');
        resultSection.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
</html>
