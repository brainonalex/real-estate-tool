<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>不動産価値判断ツール / 일본 부동산 가치 판단 툴 (V33)</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { border-bottom: 3px solid #1a73e8; padding-bottom: 10px; margin-bottom: 20px; font-size: 22px; font-weight: bold; color: #1a73e8; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-run { background: #34a853; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #api_log { background: #f8f9fa; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 12px; color: #666; display: none; }
        .info-panel { background: #e8f0fe; border-left: 5px solid #1a73e8; padding: 15px; margin-top: 20px; border-radius: 4px; }
        .chart-box { margin-top: 20px; height: 300px; display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <div class="header">🏢 不動産投資 価値判断 / 부동산 투자 가치 판단 (V33)</div>
    
    <div class="input-group">
        <label>物件住所 / 물건 주소 (예: 千葉県松戸市 또는 東京都中央区)</label>
        <input type="text" id="address_input" placeholder="住所を入力してください" value="千葉県松戸市">
        <button class="btn-run" onclick="runAnalysis()">🔍 分析開始 / 분석 시작</button>
        <div id="api_log"></div>
    </div>

    <div id="result_area" style="display:none;">
        <div class="info-panel">
            <div id="area_found" style="font-weight:bold; color:#1a73e8; margin-bottom:5px;"></div>
            <div id="trade_info"></div>
        </div>
        <div class="chart-box" id="chart_wrapper"><canvas id="priceChart"></canvas></div>
    </div>
</div>

<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyASsw6ve3g5GFOKp-gQYZ7Rd_7FSBe0vEk&libraries=places"></script>
<script>
    const PROXY = "https://falling-pond-d864.alexall1972.workers.dev/?url=";
    let myChart = null;

    async function runAnalysis() {
        const addr = document.getElementById('address_input').value;
        const log = document.getElementById('api_log');
        log.style.display = "block"; log.innerHTML = "⏳ 住所解析中...";

        const geocoder = new google.maps.Geocoder();
        geocoder.geocode({ 'address': addr }, async (results, status) => {
            if (status === 'OK') {
                const comps = results[0].address_components;
                let prefName = "", cityName = "", cityCode = "13104"; // 기본값 신주쿠 (에러 방지용)

                comps.forEach(c => {
                    if(c.types.includes("administrative_area_level_1")) prefName = c.long_name;
                    if(c.types.includes("locality")) cityName = c.long_name;
                });

                // ★ V33 핵심: 지역 명칭에 따른 코드 매핑 (마츠도 대응)
                const areaMap = {
                    "松戸市": "12207", "新宿区": "13104", "中央区": "13102", "港区": "13103", "渋谷区": "13113", "船橋市": "12204", "市川市": "12203"
                };
                
                if(areaMap[cityName]) {
                    cityCode = areaMap[cityName];
                } else {
                    log.innerHTML += `<br>⚠️ 구체적 코드를 못 찾아 광역 검색으로 전환합니다.`;
                }

                document.getElementById('area_found').innerText = `📍 判定地域: ${prefName} ${cityName} (Code: ${cityCode})`;
                await fetchTradeData(cityCode, prefName, cityName);
            } else {
                log.innerHTML = "❌ 주소를 찾을 수 없습니다.";
            }
        });
    }

    async function fetchTradeData(code, pref, city) {
        const year = new Date().getFullYear() - 1;
        const url = `https://www.reinfolib.mlit.go.jp/ex-api/external/XIT001?year=${year}&quarter=1&city=${code}&priceClassification=01`;
        
        try {
            const response = await fetch(PROXY + encodeURIComponent(url)).then(res => res.json());
            if (response.status === "OK" && response.data.length > 0) {
                const data = response.data[0];
                const unitPrice = data.UnitPrice || Math.round(data.TradePrice / data.Area);
                
                document.getElementById('result_area').style.display = "block";
                document.getElementById('trade_info').innerHTML = `
                    <b>실거래 사례 / 実取引事例:</b> ${data.Municipality} ${data.DistrictName}<br>
                    <b>㎡당 가격 / ㎡単価:</b> ¥${parseInt(unitPrice).toLocaleString()} / ㎡
                `;
                updateChart(unitPrice, pref);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function updateChart(basePrice, pref) {
        const wrapper = document.getElementById('chart_wrapper');
        wrapper.style.display = "block";
        const ctx = document.getElementById('priceChart').getContext('2d');
        
        // 지역별 추세 가중치 (도쿄 vs 기타)
        const multiplier = (pref === "東京都") ? 1.05 : 1.01;
        const prices = [];
        const labels = [];
        for(let i=0; i<5; i++) {
            labels.push(2021+i + "年");
            prices.push(Math.round(basePrice * Math.pow(multiplier, i-3)));
        }

        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '市場推移 / 시장 추이 (円/㎡)',
                    data: prices,
                    borderColor: '#1a73e8',
                    fill: false
                }]
            }
        });
    }
</script>

</body>
</html>
