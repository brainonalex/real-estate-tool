<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不動産投資 価値判断ツール (V4)</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: #f0f2f5; color: #1c1e21; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        h1 { font-size: 26px; color: #1a73e8; border-bottom: 3px solid #1a73e8; padding-bottom: 15px; margin-bottom: 30px; }
        .form-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .full-width { grid-column: span 2; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #4b4b4b; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; background-color: #f9f9f9; }
        input:focus { outline: none; border-color: #1a73e8; background-color: #fff; }
        .address-group { display: flex; gap: 10px; }
        .address-group select { width: 30%; }
        button { background-color: #1a73e8; color: white; border: none; padding: 18px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; }
        button:hover { background-color: #1557b0; }
        .result-box { margin-top: 40px; padding: 30px; border-radius: 12px; display: none; border: 2px solid #eee; }
        .score-circle { font-size: 60px; font-weight: bold; text-align: center; margin: 20px 0; }
        .status { font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .details-list { list-style: none; padding: 0; }
        .details-list li { margin-bottom: 12px; font-size: 16px; padding: 12px; border-radius: 6px; background: rgba(255,255,255,0.7); border-left: 6px solid #1a73e8; }
        .alert { border-left-color: #d93025 !important; color: #a50e0e; background-color: #fce8e6 !important; }
        .warning { border-left-color: #f9ab00 !important; color: #a67300; background-color: #fef7e0 !important; }
        .good { border-left-color: #1e8e3e !important; color: #0d652d; background-color: #e6f4ea !important; }
        .api-note { font-size: 12px; color: #70757a; margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h1>不動産投資 価値判断ツール (V4)</h1>
    
    <div class="form-section">
        <div class="form-group">
            <label>エリア (지역)</label>
            <select id="area" onchange="toggleParking()">
                <option value="tokyo_osaka">東京/大阪コアエリア (도쿄/오사카 핵심지)</option>
                <option value="local">地方主要都市 (지방 주요도시)</option>
            </select>
        </div>

        <div class="form-group" id="parking_group" style="display:none;">
            <label>駐車場 (주차장)</label>
            <select id="parking">
                <option value="yes">完備 (완비)</option>
                <option value="no">無し (없음)</option>
            </select>
        </div>

        <div class="form-group full-width">
            <label>物件住所 (물건 주소)</label>
            <div class="address-group">
                <select id="prefecture">
                    <option value="">都道府県</option>
                    <option value="東京都">東京都</option><option value="大阪府">大阪府</option>
                    <option value="神奈川県">神奈川県</option><option value="埼玉県">埼玉県</option>
                    <option value="千葉県">千葉県</option><option value="愛知県">愛知県</option>
                    <option value="福岡県">福岡県</option>
                </select>
                <input type="text" id="address_detail" placeholder="市区町村以降の住所を入力 (시/구 이하 상세 주소)">
            </div>
            <div class="api-note">※ API連動時、都道府県と詳細住所を分けて認識することで精度を高めます。</div>
        </div>

        <div class="form-group">
            <label>物件価格 (매매가 - 円)</label>
            <input type="text" id="price" value="120,000,000" oninput="formatInput(this)">
        </div>

        <div class="form-group">
            <label>積算価格 (적산가 - 円)</label>
            <input type="text" id="sekisan" value="85,000,000" oninput="formatInput(this)">
        </div>

        <div class="form-group">
            <label>築年数 (건축 경과 연수 - 年)</label>
            <select id="age"></select> 
        </div>

        <div class="form-group">
            <label>駅徒歩 (역 도보 - 分)</label>
            <select id="station_dist"></select>
        </div>

        <div class="form-group">
            <label>総戸数 (총 방 개수 - 戸)</label>
            <input type="number" id="room_count" value="10">
        </div>

        <div class="form-group">
            <label>現状の月額総家賃 (현재 총 월세 - 円)</label>
            <input type="text" id="current_rent" value="750,000" oninput="formatInput(this)">
        </div>

        <div class="form-group">
            <label>周辺相場家賃/戸 (방 1개당 주변 평균 월세 - 円)</label>
            <input type="text" id="market_rent_per_room" value="80,000" oninput="formatInput(this)">
        </div>

        <div class="form-group">
            <label>月間純キャッシュフロー (월 순 현금흐름 - 円)</label>
            <input type="text" id="cashflow" value="150,000" oninput="formatInput(this)">
        </div>
    </div>

    <div class="form-group full-width" style="margin-top: -10px;">
        <label style="color:#d93025;"><input type="checkbox" id="illegal" style="transform: scale(1.3); margin-right: 10px;"> 再建築不可 / 違法建築 (재건축 불가 / 위법 건축)</label>
    </div>

    <button onclick="calculateValue()">投資価値を判定する (판정하기)</button>

    <div id="result_section" class="result-box">
        <div class="status" id="final_status">判定結果</div>
        <div class="score-circle" id="final_score">0点</div>
        <ul class="details-list" id="feedback_list"></ul>
    </div>
</div>

<script>
    // 페이지 로드 시 드롭다운 숫자 채우기
    document.addEventListener('DOMContentLoaded', function() {
        const ageSelect = document.getElementById('age');
        for(let i=0; i<=50; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerHTML = i + " 年";
            if(i === 10) opt.selected = true;
            ageSelect.appendChild(opt);
        }

        const distSelect = document.getElementById('station_dist');
        for(let i=1; i<=30; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerHTML = i + " 分";
            if(i === 8) opt.selected = true;
            distSelect.appendChild(opt);
        }
    });

    // 실시간 콤마(,) 포맷팅 함수
    function formatInput(input) {
        let value = input.value.replace(/,/g, '');
        if (!isNaN(value) && value !== "") {
            input.value = Number(value).toLocaleString();
        }
    }

    function toggleParking() {
        const area = document.getElementById('area').value;
        const parkingGroup = document.getElementById('parking_group');
        parkingGroup.style.display = (area === 'local') ? 'block' : 'none';
    }

    function calculateValue() {
        // 값 가져오기 및 콤마 제거
        const getNum = (id) => parseFloat(document.getElementById(id).value.replace(/,/g, '')) || 0;
        
        const area = document.getElementById('area').value;
        const price = getNum('price');
        const sekisan = getNum('sekisan');
        const age = parseInt(document.getElementById('age').value);
        const stationDist = parseInt(document.getElementById('station_dist').value);
        const parking = document.getElementById('parking').value;
        const roomCount = parseInt(document.getElementById('room_count').value) || 0;
        const currentRent = getNum('current_rent');
        const marketRentPerRoom = getNum('market_rent_per_room');
        const cashflow = getNum('cashflow');
        const illegal = document.getElementById('illegal').checked;

        const totalMarketRent = roomCount * marketRentPerRoom;

        let score = 100;
        let isRejected = false;
        let feedbacks = [];

        // 로직 1: 하드 필터
        if (illegal) { feedbacks.push({ msg: "【却下】 再建築不可・違法建築物件です。", type: "alert" }); isRejected = true; }
        if (cashflow < 0) { feedbacks.push({ msg: "【却下】 キャッシュフローがマイナスです。", type: "alert" }); isRejected = true; }
        if (age > 15) { feedbacks.push({ msg: `【警告】 築年数が ${age}年です (基準15年以内)。`, type: "warning" }); score -= 10; }
        if (stationDist > 12) { feedbacks.push({ msg: "【却下】 駅徒歩12分を超過しています。", type: "alert" }); isRejected = true; }

        // 로직 2: 적산가 비율
        const sekisanRatio = (sekisan / price) * 100;
        if (sekisanRatio <= 50) {
            feedbacks.push({ msg: `【危険】 積算比率が非常に低い(${sekisanRatio.toFixed(1)}%)。`, type: "alert" });
            score -= 40;
        } else if (area === 'tokyo_osaka') {
            if (sekisanRatio >= 80 && sekisanRatio <= 110) feedbacks.push({ msg: "【良好】 積算比率が都心基準を満たしています。", type: "good" });
            else { feedbacks.push({ msg: `【注意】 積算比率(${sekisanRatio.toFixed(1)}%)が基準外です。`, type: "warning" }); score -= 15; }
        } else {
            if (sekisanRatio >= 60 && sekisanRatio <= 80) feedbacks.push({ msg: "【良好】 積상比率が地方基準を満たしています。", type: "good" });
            else { feedbacks.push({ msg: `【注意】 積算比率(${sekisanRatio.toFixed(1)}%)이 지방 기준외입니다.`, type: "warning" }); score -= 15; }
        }

        // 로직 3: 역 거리 상세 점수
        if (stationDist <= 5) feedbacks.push({ msg: "【最強】 駅徒歩5分以内の希少立地です。", type: "good" });
        else if (stationDist <= 8) { feedbacks.push({ msg: "【良好】 駅徒歩8分以内、客付けに有利です。", type: "good" }); score -= 2; }
        else if (stationDist <= 10) { feedbacks.push({ msg: "【許容】 駅徒歩10分以内、一般的許容範囲です。", type: "warning" }); score -= 5; }
        else { feedbacks.push({ msg: "【要慎重】 駅徒歩12分、周辺環境の強みが必須です。", type: "warning" }); score -= 15; }

        // 로직 4: 월세 업사이드
        const rentGap = ((totalMarketRent - currentRent) / currentRent) * 100;
        if (rentGap > 5) { feedbacks.push({ msg: `【魅力】 家賃アップ余地が ${rentGap.toFixed(1)}% あります。`, type: "good" }); score += 10; }
        else if (rentGap < -5) { feedbacks.push({ msg: `【リスク】 現状家賃が相場より高いです。`, type: "alert" }); score -= 15; }

        // 결과 표시
        const resultSection = document.getElementById('result_section');
        resultSection.style.display = 'block';
        const feedbackList = document.getElementById('feedback_list');
        feedbackList.innerHTML = '';

        score = Math.max(0, Math.min(100, score));
        if (isRejected) score = 0;

        document.getElementById('final_score').innerText = score + " 点";
        const statusEl = document.getElementById('final_status');

        if (isRejected) { statusEl.innerText = "🚨 投資対象外 (Reject)"; statusEl.style.color = "#d93025"; }
        else if (score >= 80) { statusEl.innerText = "✅ 積極検討 (Pass)"; statusEl.style.color = "#1e8e3e"; }
        else if (score >= 60) { statusEl.innerText = "⚠️ 慎重調査 (Hold)"; statusEl.style.color = "#f9ab00"; }
        else { statusEl.innerText = "❌ 見送り推奨 (Weak)"; statusEl.style.color = "#d93025"; }

        feedbacks.forEach(f => {
            let li = document.createElement('li');
            li.className = f.type;
            li.innerText = f.msg;
            feedbackList.appendChild(li);
        });
        
        resultSection.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
